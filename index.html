<!DOCTYPE html>
<html>

<head>
  <title>TOADX</title>

  <style>

    body{
      background:#050505;
      color:white;
      font-family:Arial, sans-serif;
      text-align:center;
      padding:40px;
      margin:0;
    }

    .box{
      max-width:850px;
      margin:auto;
      background:#111111;
      padding:40px;
      border-radius:25px;
      box-shadow:0 0 30px rgba(0,255,100,0.15);
    }

    .image-row{
      display:flex;
      justify-content:center;
      align-items:center;
      flex-wrap:wrap;
      margin-bottom:25px;
    }

    img{
      width:240px;
      height:auto;
      border-radius:20px;
      margin:10px;
      box-shadow:0 0 25px rgba(0,255,100,0.25);
    }

    h1{
      font-size:70px;
      color:#7CFF00;
      margin-bottom:20px;
      text-shadow:0 0 25px #7CFF00;
    }

    .slogan{
      font-size:34px;
      margin-bottom:35px;
      color:#FFD700;
      text-shadow:0 0 10px #FFD700;
    }

    .story{
      font-size:25px;
      line-height:1.8;
      color:#00FFFF;
      margin-bottom:35px;
      text-shadow:0 0 10px #00FFFF;
    }

    .story2{
      font-size:24px;
      line-height:1.8;
      color:#FF66CC;
      margin-bottom:35px;
      text-shadow:0 0 10px #FF66CC;
    }

    .story3{
      font-size:24px;
      line-height:1.8;
      color:#FFA500;
      margin-bottom:35px;
      text-shadow:0 0 10px #FFA500;
    }

    .highlight{
      color:#7CFF00;
      font-weight:bold;
    }

    .buybutton{
      display:inline-block;
      padding:20px 45px;
      background:#7CFF00;
      color:black;
      text-decoration:none;
      font-size:26px;
      border-radius:15px;
      font-weight:bold;
      transition:0.3s;
      box-shadow:0 0 25px rgba(124,255,0,0.5);
      margin-top:10px;
    }

    .buybutton:hover{
      transform:scale(1.08);
      box-shadow:0 0 40px rgba(124,255,0,0.8);
    }

    .social{
      display:inline-block;
      padding:12px 24px;
      text-decoration:none;
      font-size:18px;
      border-radius:12px;
      font-weight:bold;
      margin:10px;
      transition:0.3s;
    }

    .twitter{
      background:#1DA1F2;
      color:white;
      box-shadow:0 0 15px rgba(29,161,242,0.6);
    }

    .telegram{
      background:#229ED9;
      color:white;
      box-shadow:0 0 15px rgba(34,158,217,0.6);
    }

    .social:hover{
      transform:scale(1.05);
    }

    .footer{
      margin-top:45px;
      color:#aaaaaa;
      font-size:18px;
    }

  </style>

</head>

<body>

  <div class="box">

    <!-- 3 ảnh đầu -->
    <div class="image-row">
      <img src="logo.png">
      <img src="logo6.png">

    </div>

    <div class="slogan">
      1 Toad. 2 Bullfrogs. 1 Legend.
    </div>

    <div class="story">
      <span class="highlight">
      1 toad + 2 bullfrogs survived in a toilet for over a year...
      </span>
      <br><br>
      and now they have their own coin.
    </div>

    <div class="story2">
      This is not just a meme coin.
      <br>
      This is a real story.
    </div>

    <div class="story3">
      Hidden gem.
      <br>
      Not everyone will understand it early.
    </div>

    <!-- BUY BUTTON -->
    <a class="buybutton"
       href="https://join.pump.fun/HSag/vhu2qnr1"
       target="_blank">
      BUY TOADX
    </a>

    <br><br><br>

    <!-- SOCIAL BUTTONS -->
    <a class="social twitter"
       href="https://x.com/toadxpumpfun?s=21"
       target="_blank">
       X / Twitter
    </a>

    <a class="social telegram"
       href="https://t.me/TOADXPUMPFUN"
       target="_blank">
       Telegram
    </a>

    <div class="footer">
      From Toilet To The Moon 🚀
    </div>

    <br><br>

    <!-- 3 ảnh cuối -->
    <div class="image-row">
      <img src="logo2.png">
      <img src="logo7.png">
      <img src="logo3.png">
    </div>

  </div>

</body>

</html>
