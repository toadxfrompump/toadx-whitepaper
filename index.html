<!DOCTYPE html>
<html>

<head>
  <title>TOADX</title>

  <style>

    body{
      background:#050505;
      color:white;
      font-family:Arial, sans-serif;
      text-align:center;
      padding:40px;
      margin:0;
    }

    .box{
      max-width:750px;
      margin:auto;
      background:#111111;
      padding:40px;
      border-radius:25px;
      box-shadow:0 0 30px rgba(0,255,100,0.15);
    }

    img{
      width:260px;
      border-radius:20px;
      margin-bottom:25px;
      box-shadow:0 0 25px rgba(0,255,100,0.25);
    }

    h1{
      font-size:65px;
      color:#7CFF00;
      margin-bottom:20px;
      text-shadow:0 0 20px #7CFF00;
    }

    .slogan{
      font-size:32px;
      margin-bottom:35px;
      color:white;
    }

    p{
      font-size:24px;
      line-height:1.8;
      color:#dddddd;
      margin-bottom:35px;
    }

    .highlight{
      color:#7CFF00;
      font-weight:bold;
    }

    .button{
      display:inline-block;
      padding:18px 40px;
      background:#7CFF00;
      color:black;
      text-decoration:none;
      font-size:24px;
      border-radius:15px;
      font-weight:bold;
      transition:0.3s;
      box-shadow:0 0 20px rgba(124,255,0,0.4);
    }

    .button:hover{
      transform:scale(1.05);
      box-shadow:0 0 35px rgba(124,255,0,0.7);
    }

    .footer{
      margin-top:40px;
      color:#888;
      font-size:18px;
    }

  </style>

</head>

<body>

  <div class="box">

    <!-- Upload ảnh logo tên logo.png -->
    <img src="logo.png">

    <h1>TOADX</h1>

    <div class="slogan">
      1 Toad. 2 Bullfrogs. 1 Legend.
    </div>

    <p>
      <span class="highlight">
      1 toad + 2 bullfrogs survived in a toilet for over a year...
      </span>
      <br><br>
      and now they have their own coin.
    </p>

    <p>
      This is not just a meme coin.
      <br>
      This is a real story.
    </p>

    <p>
      Hidden gem.
      <br>
      Not everyone will understand it early.
    </p>

    <!-- Sau này thay # bằng link Pumpfun -->
    <a class="button" href="#">
      BUY TOADX
    </a>

    <div class="footer">
      From Toilet To The Moon 🚀
    </div>

  </div>

</body>

</html>
